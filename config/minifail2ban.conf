# minifail2ban configuration
# Lines starting with # or ; are comments. Everything lives in one section.

[minifail2ban]

# Where to read SSH events from.
#   file    - follow a log file (Debian/Ubuntu: /var/log/auth.log, RHEL/Fedora: /var/log/secure)
#   journal - follow the systemd journal (use this if /var/log/auth.log does not exist)
source = file
logfile = /var/log/auth.log
# Journal units to follow when source = journal (Debian/Ubuntu use "ssh", RHEL uses "sshd").
journal_units = ssh sshd

# Ban an IP that fails `maxretry` logins within `findtime` seconds.
maxretry = 5
findtime = 600

# How long a ban lasts, in seconds. 0 = permanent.
bantime = 3600

# Firewall backend: auto (prefers nftables), nftables, iptables, or dryrun (log only).
backend = auto

# IPs and CIDR ranges that are NEVER banned (space or comma separated).
# IMPORTANT: add your own public IP here so you cannot lock yourself out.
whitelist = 127.0.0.0/8 ::1
# whitelist = 127.0.0.0/8 ::1 203.0.113.0/24

# Where bans and statistics are stored (survives restarts and reboots).
state_file = /var/lib/minifail2ban/state.json

# DEBUG, INFO, WARNING or ERROR. Output goes to stderr, i.e. the journal under systemd:
#   journalctl -u minifail2ban -f
log_level = INFO
